<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>차량 이미지 제작 대시보드 v6</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <div class="mobile-tabbar" id="mobileTabbar">
    <button type="button" class="mobile-tab active" id="tabInputBtn">✏️ 입력</button>
    <button type="button" class="mobile-tab" id="tabPreviewBtn">🖼️ 미리보기</button>
  </div>

  <div class="app">
    <aside class="panel">
      <h1>차량 이미지 제작 대시보드</h1>

      <label>
        <span>기준일자</span>
        <input type="date" id="dateInput" />
      </label>

      <label>
        <span>차량명</span>
        <select id="carSelect"></select>
      </label>

      <div id="registeredCarGroup">
        <div class="grid2">
          <label>
            <span>엔진</span>
            <select id="fuelSelect"></select>
          </label>
          <label>
            <span>트림</span>
            <select id="trimSelect"></select>
          </label>
        </div>

        <label>
          <span>차량색상</span>
          <select id="colorSelect"></select>
        </label>
      </div>

      <div id="customCarImageGroup">
        <label>
          <span>차량 이미지 직접 업로드 (선택 — 업로드하면 그 사진이 우선 적용돼요)</span>
          <input type="file" id="customCarImageInput" accept="image/*" />
        </label>

        <div id="customImageAdjustGroup" class="custom-image-adjust" style="display:none">
          <p class="hint" style="margin-top:0">직접 올린 사진은 원본 구도가 제각각이라 자동으로 위치가 안 맞을 수 있어요. 아래에서 크기·위치를 맞춰보세요.</p>
          <label>
            <span>차량 이미지 크기 (<span id="customImageScaleValue">100</span>%)</span>
            <input type="range" id="customImageScale" min="40" max="180" value="100" />
          </label>
          <div class="grid2">
            <label>
              <span>좌우 위치</span>
              <input type="range" id="customImageX" min="-300" max="300" value="0" />
            </label>
            <label>
              <span>상하 위치</span>
              <input type="range" id="customImageY" min="-250" max="250" value="0" />
            </label>
          </div>
          <div class="grid2">
            <button type="button" class="secondary-btn" id="resetCustomImagePosBtn">위치 초기화</button>
            <button type="button" class="secondary-btn" id="clearCustomImageBtn">사진 제거</button>
          </div>
        </div>
      </div>

      <label>
        <span>표시용 차량명 (직접 수정 가능)</span>
        <input type="text" id="carNameDisplayInput" />
      </label>

      <label>
        <span>표시용 트림명 (직접 수정 가능)</span>
        <input type="text" id="trimDisplayInput" />
      </label>

      <div class="grid2">
        <label>
          <span>약정기간</span>
          <input type="text" id="periodInput" value="" placeholder="예: 48개월" />
        </label>
        <label>
          <span>차량가격</span>
          <input type="text" id="priceInput" />
        </label>
      </div>

      <div class="grid2">
        <label>
          <span>만기인수가</span>
          <input type="text" id="residualInput" value="17,750,000원" />
        </label>
        <label>
          <span>보증금</span>
          <input type="text" id="depositInput" value="1,000,000원" />
        </label>
      </div>

      <label>
        <span id="rentInputLabel">월렌트료</span>
        <input type="text" id="rentInput" value="675,000원" />
      </label>

      <div class="option-head">
        <strong>옵션 선택</strong>
      </div>

      <div id="optionInputList" class="option-input-list"></div>
      <button type="button" class="add-option-btn" id="addOptionBtn">+ 옵션 추가</button>

      <button type="button" class="primary-btn" id="downloadBtn">PNG 다운로드</button>
    </aside>

    <main class="preview-wrap">
      <div class="preview-scale">
        <div id="poster" class="poster">
          <div class="hero">
            <div class="date" id="previewDate"></div>
            <div class="title" id="previewCarName"></div>
            <div class="trim-pill" id="previewTrim"></div>
            <img class="car-image" id="previewCarImage" alt="차량 이미지" />
          </div>

          <div class="price-box">
            <div class="spec-grid">
              <div class="spec-item">
                <span class="dot"></span><strong>약정기간</strong><span class="spec-value" id="previewPeriod"></span>
              </div>
              <div class="spec-item">
                <span class="dot"></span><strong>차량가격</strong><span class="spec-value" id="previewPrice"></span>
              </div>
              <div class="spec-item">
                <span class="dot"></span><strong>만기인수가</strong><span class="spec-value" id="previewResidual"></span>
              </div>
              <div class="spec-item blank"></div>
            </div>
            <div class="rent-strip">
              <div class="rent-item"><strong>보증금</strong><span id="previewDeposit" class="accent"></span></div>
              <div class="rent-item"><strong id="previewRentLabel">월렌트료</strong><span id="previewRent" class="accent"></span></div>
            </div>
          </div>

          <div class="section-title" id="optionsTitle"><span></span><h2>옵션</h2><span></span></div>

          <div class="options-area" id="optionsArea">
            <div class="option-card" id="optionCard1">
              <img class="option-thumb-img" id="optImg1" alt="" />
              <div class="option-copy"><h3 id="optTitle1"></h3><p id="optDesc1"></p></div>
            </div>
            <div class="option-card" id="optionCard2">
              <img class="option-thumb-img" id="optImg2" alt="" />
              <div class="option-copy"><h3 id="optTitle2"></h3><p id="optDesc2"></p></div>
            </div>
            <div class="option-card" id="optionCard3">
              <img class="option-thumb-img" id="optImg3" alt="" />
              <div class="option-copy"><h3 id="optTitle3"></h3><p id="optDesc3"></p></div>
            </div>
            <div class="option-card" id="optionCard4">
              <img class="option-thumb-img" id="optImg4" alt="" />
              <div class="option-copy"><h3 id="optTitle4"></h3><p id="optDesc4"></p></div>
            </div>
            <div class="option-card" id="optionCard5">
              <img class="option-thumb-img" id="optImg5" alt="" />
              <div class="option-copy"><h3 id="optTitle5"></h3><p id="optDesc5"></p></div>
            </div>
            <div class="option-card" id="optionCard6">
              <img class="option-thumb-img" id="optImg6" alt="" />
              <div class="option-copy"><h3 id="optTitle6"></h3><p id="optDesc6"></p></div>
            </div>
            <div class="option-card" id="optionCard7">
              <img class="option-thumb-img" id="optImg7" alt="" />
              <div class="option-copy"><h3 id="optTitle7"></h3><p id="optDesc7"></p></div>
            </div>
            <div class="option-card" id="optionCard8">
              <img class="option-thumb-img" id="optImg8" alt="" />
              <div class="option-copy"><h3 id="optTitle8"></h3><p id="optDesc8"></p></div>
            </div>
          </div>

          <div class="benefits">
            <div class="benefit">
              <div class="benefit-badge">혜택1</div>
              <div class="benefit-body">
                <img class="benefit-photo" src="images/benefits/benefit_blackbox.png" alt="블랙박스" />
                <div class="benefit-text">블랙박스<br />무상탑재!</div>
              </div>
            </div>
            <div class="benefit">
              <div class="benefit-badge">혜택2</div>
              <div class="benefit-body">
                <img class="benefit-photo" src="images/benefits/benefit_tinting.png" alt="측후면 썬팅" />
                <div class="benefit-text">측후면<br />썬팅제공!</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <button type="button" id="feedbackFab" title="피드백 남기기"><span class="fb-icon">💬</span>피드백</button>

  <div id="feedbackOverlay" class="feedback-overlay">
    <div class="feedback-modal">
      <button type="button" id="feedbackCloseBtn" class="feedback-close">×</button>
      <h2>불편한 점 · 아이디어 남기기</h2>
      <p class="feedback-desc">사용 중 발견한 버그나 추가됐으면 하는 기능을 편하게 남겨주세요.</p>

      <form id="feedbackForm">
        <label class="fb-label">이름 (선택)</label>
        <input type="text" id="fbName" class="fb-input" placeholder="예: 김하모니" />

        <label class="fb-label">분류</label>
        <select id="fbCategory" class="fb-input">
          <option value="버그 제보">🐞 버그 제보</option>
          <option value="기능 제안">💡 기능 제안</option>
          <option value="이미지/데이터 요청">🖼️ 이미지·데이터 요청</option>
          <option value="기타">✏️ 기타</option>
        </select>

        <label class="fb-label">내용</label>
        <textarea id="fbMessage" class="fb-input" rows="4" placeholder="어떤 점이 불편하셨나요?" required></textarea>

        <button type="submit" class="fb-submit" id="fbSubmitBtn">피드백 보내기</button>
        <p class="fb-status" id="fbStatus"></p>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="genesis_data_addon.js"></script>
  <script src="script.js"></script>
</body>
</html>
